# CI for this repo. Repo-owned: dev-system scaffolds it once (`callum-dev init`) and never syncs it.
# The lint and test commands below must match `gateCommands` in .claude/factory-loop.json and the
# "Canonical commands" section of CLAUDE.md: the factory loop's gate and CI run the same commands.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Toolchain and install
        run: npm ci

      - name: Lint (typecheck)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build

      - name: Smoke-test the server (proxy + static)
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8787/api/health | grep '"ok": true'
          EXPECTED=$(node -p "require('./package.json').version")
          ACTUAL=$(curl -fsS http://localhost:8787/api/health | jq -r .version)
          test "$ACTUAL" = "$EXPECTED" || { echo "health version $ACTUAL != package.json $EXPECTED"; exit 1; }
          curl -fsS http://localhost:8787/ | grep -qi '<!doctype html>'
          kill $SERVER_PID

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name vost-ci -p 8787:8787 vost:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8787/api/health | grep '"ok": true'
          EXPECTED=$(node -p "require('./package.json').version")
          ACTUAL=$(curl -fsS http://localhost:8787/api/health | jq -r .version)
          test "$ACTUAL" = "$EXPECTED" || { echo "health version $ACTUAL != package.json $EXPECTED"; exit 1; }
          docker rm -f vost-ci
