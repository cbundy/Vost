name: Publish dev image

# Builds and publishes ghcr.io/cbundy/vost/dev from .devcontainer/Dockerfile: the
# dev-system base image plus Playwright's Chromium and its system libraries, so the
# loop's `npm run e2e:capture` can launch a browser.
#
# - pull_request: build + smoke test only, never pushes.
# - push to main, workflow_dispatch (main only), schedule: build, test, push `latest`
#   and `sha-<short>`.
# - schedule (weekly): after dev-system's Monday base:2 rebuild.
on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/publish-dev-image.yml"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/publish-dev-image.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: publish-dev-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/cbundy/vost/dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to push
        id: push
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT" in
            pull_request) push=false ;;
            *)
              # `latest` is what the loop workspace pulls, so only main may publish it.
              if [ "$REF" != refs/heads/main ]; then
                echo "::error::Publish only from main (this run is on $REF)."
                exit 1
              fi
              push=true
              ;;
          esac
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      # The point of the image: a headless browser starts and takes a screenshot
      # as the workspace user.
      - name: Smoke test the browser
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --entrypoint "" --user node \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$IMAGE:latest" \
            bash -euo pipefail -c 'npm ci && node -e "
              const { chromium } = require(\"playwright\");
              (async () => {
                const b = await chromium.launch();
                const p = await b.newPage();
                await p.setContent(\"<h1>ok</h1>\");
                await p.screenshot({ path: \"/tmp/smoke.png\" });
                await b.close();
                console.log(\"browser ok\");
              })().catch(e => { console.error(e); process.exit(1); });
            "'

      - name: Push image
        if: steps.push.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
